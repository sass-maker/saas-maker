name: SaaS Maker MCP Production Monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: saas-maker-mcp-production-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mcp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm monitor:production -- --output production-monitor-receipt.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-receipt
          path: apps/mcp/production-monitor-receipt.json
          if-no-files-found: error
          retention-days: 30
