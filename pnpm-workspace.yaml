packages:
  - 'packages/widgets/feedback-widget'
  - 'packages/ai-chat-footer'
  - 'packages/newsletter-capture'
  - 'packages/portfolio-project-strip'
  - 'apps/cockpit'
  - 'apps/showcase'
  - 'apps/memory-map'
  - 'workers/api'
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
  workerd: true
# Supply-chain release-age policy: pin rollup to a vetted version even
# when Astro pulls a fresher one transitively. See fleet AGENTS.md →
# release-age policy.
overrides:
  rollup: 4.60.2
  esbuild: 0.28.1
  # Memory Map runs Transformers.js in the browser only; never install the native runtime.
  '@huggingface/transformers@3.8.1>onnxruntime-node': '-'
  # Memory Map security pins carried over from chatgpt-memory-insights, scoped to its Astro.
  'astro@7.2.8>devalue': 5.9.3
  'astro@7.2.8>http-cache-semantics': 4.3.0
  'astro@7.2.8>smol-toml': 1.9.0
